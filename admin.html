<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم - Fashion Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header a {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 10px 20px;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .dashboard-title {
            margin-bottom: 25px;
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .order-card h3 {
            margin-bottom: 15px;
        }

        .order-card p {
            margin: 8px 0;
        }

        .order-total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .order-items {
            margin-top: 15px;
            padding: 15px;
            background: #f7f7f7;
        }
        .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.stat-card h3 {
    margin-bottom: 10px;
    font-size: 18px;
}

.stat-card p {
    font-size: 28px;
    font-weight: bold;
}

@media (max-width: 700px) {
    .stats {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

    <header>

        <h1>FASHION STORE</h1>

        <a href="index.html">
            العودة للمتجر
        </a>

    </header>

    <main>

        <div class="dashboard-title">
            <h2>لوحة التحكم</h2>
            <p>إدارة طلبات العملاء</p>
        </div>
<div class="stats">

    <div class="stat-card">
        <h3>📦 عدد الطلبات</h3>
        <p id="ordersCount">0</p>
    </div>

    <div class="stat-card">
        <h3>💰 إجمالي المبيعات</h3>
        <p id="salesTotal">0 جنيه</p>
    </div>

    <div class="stat-card">
        <h3>👕 المنتجات المباعة</h3>
        <p id="productsCount">0</p>
    </div>

</div>
        <div id="orders" class="orders">
            <p>جاري تحميل الطلبات...</p>
        </div>

    </main>

    <script>

        async function loadOrders() {

            const ordersContainer = document.getElementById("orders");

            try {

                const response = await fetch("/api/orders");

                const orders = await response.json();

                ordersContainer.innerHTML = "";
document.getElementById("ordersCount").textContent = orders.length;

const salesTotal = orders.reduce((sum, order) => {
    return sum + Number(order.total || 0);
}, 0);

document.getElementById("salesTotal").textContent =
    salesTotal + " جنيه";

const productsCount = orders.reduce((sum, order) => {
    return sum + order.items.reduce((total, item) => {
        return total + Number(item.quantity || 0);
    }, 0);
}, 0);

document.getElementById("productsCount").textContent = productsCount;
                if (orders.length === 0) {

                    ordersContainer.innerHTML =
                        "<p>لا توجد طلبات حتى الآن.</p>";

                    return;
                }

                orders.forEach(order => {

                    let itemsHTML = "";

                    order.items.forEach(item => {

                        itemsHTML += `
                            <p>
                                ${item.name}
                                | المقاس: ${item.size}
                                | الكمية: ${item.quantity}
                                | السعر: ${item.price} جنيه
                            </p>
                        `;

                    });

                    ordersContainer.innerHTML += `

                        <div class="order-card">

                            <h3>
                                طلب رقم: ${order.id}
                            </h3>

                            <p>
                                <strong>الاسم:</strong>
                                ${order.name}
                            </p>

                            <p>
                                <strong>الهاتف:</strong>
                                ${order.phone}
                            </p>

                            <p>
                                <strong>العنوان:</strong>
                                ${order.address}
                            </p>

                            <p>
                                <strong>التاريخ:</strong>
                                ${order.date}
                            </p>

                            <div class="order-items">

                                <strong>المنتجات:</strong>

                                ${itemsHTML}

                            </div>

                            <p class="order-total">
                                الإجمالي:
                                ${order.total}
                                جنيه
                            </p>

                        </div>

                    `;

                });

            } catch (error) {

                console.error(error);

                ordersContainer.innerHTML =
                    "<p>حدث خطأ في تحميل الطلبات.</p>";

            }

        }

        loadOrders();

    </script>

</body>

</html>
