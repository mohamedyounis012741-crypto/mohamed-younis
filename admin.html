<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم - Fashion Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h2 {
            margin-bottom: 10px;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .section-title {
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }

        /* الإحصائيات */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
        }

        /* نموذج إضافة المنتج */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            background: #111;
            color: white;
            margin-top: 15px;
        }

        .add-btn:hover {
            background: #333;
        }

        /* المنتجات */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #f7f7f7;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 12px;
        }

        .product-card input {
            margin-bottom: 10px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .edit-btn {
            background: #222;
            color: white;
            flex: 1;
        }

        .delete-btn {
            background: #c62828;
            color: white;
            flex: 1;
        }

        /* الطلبات */

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: #fafafa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .order-card p {
            margin: 8px 0;
        }

        .order-items {
            margin-top: 15px;
            padding: 15px;
            background: #eee;
            border-radius: 6px;
        }

        .order-total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .stats,
            .form-grid,
            .products {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>FASHION STORE</h1>

        <a href="index.html">
            العودة للمتجر
        </a>

    </header>


    <main>

        <div class="section">

            <h2>لوحة التحكم</h2>

            <p>
                من هنا تقدر تدير المنتجات والطلبات.
            </p>

        </div>


        <!-- الإحصائيات -->

        <div class="stats">

            <div class="stat-card">
                <h3>📦 عدد الطلبات</h3>
                <p id="ordersCount">0</p>
            </div>

            <div class="stat-card">
                <h3>💰 إجمالي المبيعات</h3>
                <p id="salesTotal">0 جنيه</p>
            </div>

            <div class="stat-card">
                <h3>👕 عدد المنتجات</h3>
                <p id="productsCount">0</p>
            </div>

        </div>


        <!-- إضافة منتج -->

        <div class="section">

            <div class="section-title">

                <h2>➕ إضافة منتج جديد</h2>

            </div>

            <div class="form-grid">

                <input
                    type="text"
                    id="newName"
                    placeholder="اسم المنتج"
                >

                <input
                    type="number"
                    id="newPrice"
                    placeholder="السعر"
                >

                <input
                    type="text"
                    id="newImage"
                    placeholder="مسار صورة المنتج"
                >

            </div>

            <button
                class="add-btn"
                onclick="addProduct()"
            >
                إضافة المنتج
            </button>

            <div
                id="addMessage"
                class="message"
            ></div>

        </div>


        <!-- المنتجات -->

        <div class="section">

            <div class="section-title">

                <h2>👕 إدارة المنتجات</h2>

            </div>

            <div
                id="products"
                class="products"
            >
                جاري تحميل المنتجات...
            </div>

        </div>


        <!-- الطلبات -->

        <div class="section">

            <div class="section-title">

                <h2>📦 طلبات العملاء</h2>

            </div>

            <div
                id="orders"
                class="orders"
            >
                جاري تحميل الطلبات...
            </div>

        </div>

    </main>


    <script>

        // =========================
        // تحميل المنتجات
        // =========================

        async function loadProducts() {

            const container =
                document.getElementById("products");

            try {

                const response =
                    await fetch("/api/products");

                const products =
                    await response.json();

                container.innerHTML = "";

                document.getElementById("productsCount").textContent =
                    products.length;

                if (products.length === 0) {

                    container.innerHTML =
                        "<p>لا توجد منتجات.</p>";

                    return;
                }

                products.forEach(product => {

                    container.innerHTML += `

                        <div class="product-card">

                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'"
                            >

                            <h3>
                                المنتج رقم ${product.id}
                            </h3>

                            <input
                                type="text"
                                id="name-${product.id}"
                                value="${product.name}"
                            >

                            <input
                                type="number"
                                id="price-${product.id}"
                                value="${product.price}"
                            >

                            <input
                                type="text"
                                id="image-${product.id}"
                                value="${product.image}"
                            >

                            <div class="buttons">

                                <button
                                    class="edit-btn"
                                    onclick="updateProduct(${product.id})"
                                >
                                    حفظ التعديل
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteProduct(${product.id})"
                                >
                                    حذف
                                </button>

                            </div>

                        </div>

                    `;

                });

            } catch (error) {

                console.error(error);

                container.innerHTML =
                    "<p>حدث خطأ في تحميل المنتجات.</p>";

            }

        }


        // =========================
        // إضافة منتج
        // =========================

        async function addProduct() {

            const name =
                document.getElementById("newName").value.trim();

            const price =
                document.getElementById("newPrice").value;

            const image =
                document.getElementById("newImage").value.trim();

            const message =
                document.getElementById("addMessage");


            if (!name || !price || !image) {

                message.textContent =
                    "من فضلك أدخل اسم المنتج والسعر ومسار الصورة.";

                return;
            }


            try {

                const response =
                    await fetch("/api/products", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            price: price,
                            image: image
                        })

                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message || "حدث خطأ.";

                    return;
                }


                message.textContent =
                    "✅ تم إضافة المنتج بنجاح";


                document.getElementById("newName").value = "";

                document.getElementById("newPrice").value = "";

                document.getElementById("newImage").value = "";


                loadProducts();

            } catch (error) {

                console.error(error);

                message.textContent =
                    "حدث خطأ في الاتصال بالسيرفر.";

            }

        }


        // =========================
        // تعديل المنتج
        // =========================

        async function updateProduct(id) {

            const name =
                document.getElementById(`name-${id}`).value;

            const price =
                document.getElementById(`price-${id}`).value;

            const image =
                document.getElementById(`image-${id}`).value;


            try {

                const response =
                    await fetch(`/api/products/${id}`, {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            price: price,
                            image: image
                        })

                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message || "حدث خطأ في تعديل المنتج"
                    );

                    return;
                }


                alert("✅ تم تعديل المنتج بنجاح");

                loadProducts();


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ في الاتصال بالسيرفر"
                );

            }

        }


        // =========================
        // حذف المنتج
        // =========================

        async function deleteProduct(id) {

            const confirmDelete =
                confirm("هل أنت متأكد من حذف هذا المنتج؟");


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(`/api/products/${id}`, {

                        method: "DELETE"

                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message || "حدث خطأ في حذف المنتج"
                    );

                    return;
                }


                alert("✅ تم حذف المنتج");

                loadProducts();


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ في الاتصال بالسيرفر"
                );

            }

        }


        // =========================
        // تحميل الطلبات
        // =========================

        async function loadOrders() {

            const ordersContainer =
                document.getElementById("orders");


            try {

                const response =
                    await fetch("/api/orders");

                const orders =
                    await response.json();


                ordersContainer.innerHTML = "";


                document.getElementById("ordersCount").textContent =
                    orders.length;


                const salesTotal =
                    orders.reduce((sum, order) => {

                        return sum +
                            Number(order.total || 0);

                    }, 0);


                document.getElementById("salesTotal").textContent =
                    salesTotal + " جنيه";


                if (orders.length === 0) {

                    ordersContainer.innerHTML =
                        "<p>لا توجد طلبات حتى الآن.</p>";

                    return;
                }


                orders.forEach(order => {

                    let itemsHTML = "";


                    order.items.forEach(item => {

                        itemsHTML += `

                            <p>
                                ${item.name}
                                |
                                المقاس: ${item.size}
                                |
                                الكمية: ${item.quantity}
                                |
                                السعر: ${item.price} جنيه
                            </p>

                        `;

                    });


                    ordersContainer.innerHTML += `

                        <div class="order-card">

                            <h3>
                                طلب رقم: ${order.id}
                            </h3>

                            <p>
                                <strong>الاسم:</strong>
                                ${order.name}
                            </p>

                            <p>
                                <strong>الهاتف:</strong>
                                ${order.phone}
                            </p>

                            <p>
                                <strong>العنوان:</strong>
                                ${order.address}
                            </p>

                            <p>
                                <strong>التاريخ:</strong>
                                ${order.date}
                            </p>

                            <div class="order-items">

                                <strong>
                                    المنتجات:
                                </strong>

                                ${itemsHTML}

                            </div>

                            <p class="order-total">

                                الإجمالي:
                                ${order.total}
                                جنيه

                            </p>

                        </div>

                    `;

                });


            } catch (error) {

                console.error(error);

                ordersContainer.innerHTML =
                    "<p>حدث خطأ في تحميل الطلبات.</p>";

            }

        }


        // تشغيل الصفحة

        loadProducts();

        loadOrders();

    </script>

</body>

</html>
